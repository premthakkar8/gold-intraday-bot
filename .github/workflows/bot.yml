name: gold-bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Analyse and watch price every minute
        env:
          TBOT_MODE: alert
          TBOT_NTFY_TOPIC: ${{ secrets.TBOT_NTFY_TOPIC }}
        run: python main.py live --minutes 14 --every 60

      - name: Save journal and signals
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add -f data/*.json reports/auto.log docs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to save"
            exit 0
          fi
          git commit -m "bot run $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publish the dashboard
        uses: actions/deploy-pages@v4

      - name: Start the next watch while the market is open
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "from datetime import datetime, timezone; from tbot.runner import market_open; raise SystemExit(0 if market_open(datetime.now(timezone.utc)) else 1)"; then
            gh workflow run bot.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "market closed; the schedule restarts it"
          fi
